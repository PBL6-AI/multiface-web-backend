services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: multiface-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multiface
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - multiface_web_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d multiface']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: multiface-redis
    ports:
      - '${REDIS_PORT}:6379'

volumes:
  multiface_web_data:
